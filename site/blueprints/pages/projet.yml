title: Projet
preset: page

status:
  draft: Brouillon
  listed: Publication

fields:
  categorie:
    label: Catégorie
    type: select
    options:
      reportage: Reportage
      portrait: Portrait
      atelier: Atelier
      travail-personnel: Travail personnel
    required: false

  description:
    label: Description
    type: textarea
    size: large
    required: false

  details:
    label: Détails
    type: structure
    fields:
      client:
        label: Commanditaire
        type: text
        required: false
      model:
        label: Modèle
        type: text
        required: false
      year:
        label: Date
        type: number
        min: 2000
        default: 2020
        required: false

  # Champs SEO
  metaTitle:
    label: Titre SEO
    type: text
    width: 1/2
    help: "Titre affiché dans les résultats des moteurs de recherche. 50-60 caractères recommandés."
    required: false

  metaDescription:
    label: Description SEO
    type: textarea
    width: 1/2
    help: "Description affichée dans les résultats Google. 140-160 caractères recommandés."
    required: false

sidebar:
  cover:
    label: Image de couverture
    type: files
    layout: cards
    info: "{{ file.alt.or(file.filename) }}"
    template: cover
    min: 0
    max: 1
    required: false

  gallery:
    label: Galerie de photos
    type: files
    template: image
    layout: cards
    multiple: true
    max: 20
    info: "{{ file.alt.or(file.filename) }}"
    required: false